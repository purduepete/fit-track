name: Deploy

# Manual deploy: builds the image in Azure Container Registry (az acr build) and
# points the Container App at the new tag. Deploys touch the SHARED WebPortfolio
# Azure SQL server (fit schema), so this is intentionally manual
# (workflow_dispatch), never on push.
#
# The app authenticates to Azure SQL AND pulls its image with the same
# USER-ASSIGNED managed identity (fittrack-identity, DB_AUTH=aad) — no DB password
# and no registry credentials are passed. Grant the identity access to the fit
# schema once after the first deploy (see docs/architecture.md).
#
# Required repo secrets:
#   AZURE_CREDENTIALS   - output of `az ad sp create-for-rbac --sdk-auth`
# Required repo variables:
#   FITTRACK_RG         - resource group (e.g. fittrack-rg)
#   FITTRACK_ACR        - Azure Container Registry name (e.g. fittrackacrcbc0af)
# Optional repo variables (VO2 max interpretation — blank disables it, and the
# app tolerates blank without crashing). Set these so a deploy preserves the
# athlete profile instead of clearing it:
#   ATHLETE_BIRTH_DATE  - YYYY-MM-DD
#   ATHLETE_SEX         - male | female

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image in ACR
        uses: azure/cli@v2
        with:
          inlineScript: |
            TAG="${GITHUB_SHA::7}"
            az acr build \
              -r "${{ vars.FITTRACK_ACR }}" \
              -t "fittrack:${TAG}" \
              -t "fittrack:latest" \
              .
            LOGIN_SERVER=$(az acr show -n "${{ vars.FITTRACK_ACR }}" --query loginServer -o tsv)
            echo "IMAGE=${LOGIN_SERVER}/fittrack:${TAG}" >> "$GITHUB_ENV"

      - name: Deploy infra + image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create \
              -g "${{ vars.FITTRACK_RG }}" \
              -f infra/main.bicep \
              -p acrName="${{ vars.FITTRACK_ACR }}" containerImage="$IMAGE" \
                 athleteBirthDate="${{ vars.ATHLETE_BIRTH_DATE }}" \
                 athleteSex="${{ vars.ATHLETE_SEX }}"
