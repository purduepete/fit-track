<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>fittrack</title>

    <!-- Pre-paint theme: set data-theme + launch colours before first paint so the
         installed PWA never flashes white before React mounts (FOUC fix). -->
    <script>
      (function () {
        var html = document.documentElement;
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('fittrack_theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          }
        } catch (e) {}
        html.setAttribute('data-theme', theme);
        html.style.colorScheme = theme;
        html.style.setProperty('--launch-bg', theme === 'dark' ? '#0e0f1a' : '#f4f5fb');
        html.style.setProperty('--launch-fg', theme === 'dark' ? '#e8e9f3' : '#1a1b2e');
      })();
    </script>

    <style>
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        background: var(--launch-bg, #0e0f1a);
        color: var(--launch-fg, #e8e9f3);
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100dvh;
        background: var(--launch-bg, #0e0f1a);
      }

      /* iOS standalone cold-launch mask: keep #root hidden behind a themed backdrop
         until the launch viewport settles, so the whole-page rescale ("font shrink")
         is never visible. Applied only on iOS home-screen launch; the class lives on
         <html> and is never re-added, so routing/desktop are unaffected. */
      #root {
        transition: opacity 0.18s ease-out;
      }
      html.pwa-launch-mask #root {
        visibility: hidden !important;
        opacity: 0 !important;
      }
      html.pwa-launch-mask::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        pointer-events: none;
        background: var(--launch-bg, #0e0f1a);
      }
      html.pwa-launch-mask *,
      html.pwa-no-motion * {
        transition: none !important;
        animation: none !important;
      }
    </style>

    <script>
      (function () {
        var html = document.documentElement;
        var isIOS =
          /iPad|iPhone|iPod/.test(navigator.platform) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var isStandalone =
          navigator.standalone === true ||
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        if (!isIOS || !isStandalone) return;

        // viewport-fit=cover forces the final full-screen standalone viewport from
        // frame 1, so the old visualViewport-settle poll is no longer needed. Keep a
        // minimal mask that hides #root only until React has painted, then reveal.
        html.classList.add('pwa-launch-mask', 'pwa-no-motion');

        var done = false,
          fallback = 0;
        function reveal() {
          if (done) return;
          done = true;
          clearTimeout(fallback);
          html.classList.remove('pwa-launch-mask');
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              html.classList.remove('pwa-no-motion');
            });
          });
        }
        function whenPainted() {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) reveal();
          else requestAnimationFrame(whenPainted);
        }
        requestAnimationFrame(whenPainted);
        // Safety net: never keep content hidden longer than this.
        fallback = setTimeout(reveal, 800);
      })();
    </script>

    <!-- TEMP on-device diagnostic overlay (iOS standalone only). Records the
         launch viewport timeline so we can see exactly which metric changes at
         the "shrink" moment. REMOVE once diagnosed. -->
    <script>
      (function () {
        var isIOS =
          /iPad|iPhone|iPod/.test(navigator.platform) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var isStandalone =
          navigator.standalone === true ||
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        if (!isIOS || !isStandalone) return;

        var t0 = performance.now();
        var rows = [];
        var frozen = false;

        function snap(tag) {
          var vv = window.visualViewport;
          var de = document.documentElement;
          return {
            t: Math.round(performance.now() - t0),
            tag: tag || '',
            iW: window.innerWidth,
            iH: window.innerHeight,
            cW: de.clientWidth,
            cH: de.clientHeight,
            vvW: vv ? Math.round(vv.width) : 0,
            vvH: vv ? Math.round(vv.height) : 0,
            vvS: vv ? +vv.scale.toFixed(3) : 0,
            dpr: window.devicePixelRatio,
            rfs: getComputedStyle(de).fontSize,
          };
        }
        function changed(a, b) {
          if (!a) return true;
          return (
            a.iW !== b.iW || a.iH !== b.iH || a.cW !== b.cW || a.cH !== b.cH ||
            a.vvW !== b.vvW || a.vvH !== b.vvH || a.vvS !== b.vvS ||
            a.dpr !== b.dpr || a.rfs !== b.rfs
          );
        }
        function record(tag) {
          var s = snap(tag);
          var last = rows[rows.length - 1];
          if (changed(last, s) || tag) rows.push(s);
          render();
        }

        var box;
        function ensureBox() {
          if (box) return box;
          box = document.createElement('div');
          box.style.cssText =
            'position:fixed;top:0;left:0;right:0;z-index:2147483647;' +
            'background:rgba(0,0,0,.88);color:#0f0;font:11px/1.35 ui-monospace,Menlo,monospace;' +
            'padding:6px 8px;white-space:pre;overflow:auto;max-height:60vh;pointer-events:auto;';
          box.addEventListener('click', function () {
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
          });
          (document.body || document.documentElement).appendChild(box);
          return box;
        }
        function render() {
          var b = ensureBox();
          var meta = document.querySelector('meta[name=viewport]');
          var vfit = meta && /viewport-fit=cover/.test(meta.content) ? 'YES' : 'NO';
          var head =
            'DIAG (tap to hide) build=vfit-cover\n' +
            'viewport-fit=cover in meta: ' + vfit + '\n' +
            'standalone=' + (navigator.standalone === true) +
            ' dm=' + (window.matchMedia('(display-mode: standalone)').matches) + '\n' +
            't    tag  iW   iH   cW   cH   vvW  vvH  vvS   dpr  rootFS\n';
          var body = rows
            .map(function (r) {
              return (
                pad(r.t, 5) + pad(r.tag, 5) + pad(r.iW, 5) + pad(r.iH, 5) +
                pad(r.cW, 5) + pad(r.cH, 5) + pad(r.vvW, 5) + pad(r.vvH, 5) +
                pad(r.vvS, 6) + pad(r.dpr, 5) + r.rfs
              );
            })
            .join('\n');
          b.textContent = head + body;
        }
        function pad(v, n) {
          v = '' + v;
          while (v.length < n) v += ' ';
          return v;
        }

        function start() {
          record('t0');
          var raf = function () {
            record('');
            if (performance.now() - t0 < 6000) requestAnimationFrame(raf);
            else {
              record('end');
              frozen = true;
            }
          };
          requestAnimationFrame(raf);
          var vv = window.visualViewport;
          if (vv) {
            vv.addEventListener('resize', function () { record('vvR'); });
            vv.addEventListener('scroll', function () { record('vvS'); });
          }
          window.addEventListener('resize', function () { record('winR'); });
          window.addEventListener('orientationchange', function () { record('orient'); });
        }
        if (document.body) start();
        else document.addEventListener('DOMContentLoaded', start);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
