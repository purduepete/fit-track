name: Uptime

# Checks the public Cloudflare Access boundary. The dedicated host watchdog
# checks /api/ready, including PostgreSQL, on the protected origin.

on:
  schedule:
    # 05:00 / 13:00 / 21:00 UTC (~22:00 / 06:00 / 14:00 America/Los_Angeles)
    - cron: "0 5,13,21 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override the URL to probe (for testing the check itself)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Microsoft sign-in boundary
        env:
          DEFAULT_URL: https://fittrack.jimlertech.com
          INPUT_URL: ${{ github.event.inputs.base_url }}
        run: |
          set -uo pipefail
          base="${INPUT_URL:-$DEFAULT_URL}"
          url="$base/api/health"

          if [ -n "$INPUT_URL" ]; then
            target="manual override ($url)"
          else
            target="production ($url)"
          fi
          echo "Probing $target"

          for attempt in 1 2 3; do
            echo "Attempt $attempt: GET $url"
            code=$(curl -sS -D headers.txt -o body.txt -w '%{http_code}' --max-time 30 "$url") && rc=0 || rc=$?

            if [ "$rc" -ne 0 ]; then
              echo "curl failed (exit $rc)."
            elif [ "$code" = "302" ] && grep -Eiq '^location: https://[^/]+\.cloudflareaccess\.com/' headers.txt; then
              echo "Cloudflare Access protects the public route."
              exit 0
            else
              echo "Expected an Access login redirect; received HTTP $code."
            fi

            [ "$attempt" -lt 3 ] && sleep 30
          done

          echo "::error::Access boundary check failed for $target. Check the FitTrack Access application, DNS, and tunnel route."
          exit 1
