<!-- Source for apple-touch-icon.png. Full bleed on purpose: iOS applies its own rounded mask, and
     the rx=6 corner favicon.svg uses leaves light wedges under it. Re-render at 180x180 after editing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="180" height="180" role="img" aria-label="Fit Track">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#g)" />
  <path d="M56 32h-8l-6 16-12-32-6 16H8" fill="none" stroke="#ffffff" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
